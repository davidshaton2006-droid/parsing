name: Marketing visual QA
on:
  push:
    branches: [main, marketing-provably-hero, marketing-pinned-approach, marketing-content-revision, marketing-compact-copy, marketing-steps-path, marketing-steps-alignment]
    paths:
      - 'marketing/**'
      - '.github/scripts/marketing-visual-qa.py'
      - '.github/scripts/marketing-motion-vendor.sh'
      - '.github/scripts/marketing-peak-chart-build.sh'
      - '.github/scripts/marketing-provably-build.sh'
      - '.github/workflows/marketing-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: marketing-visual-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Link QA run to commit
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({...context.repo,sha:context.sha,state:'pending',context:'marketing-visual-qa',target_url:process.env.GITHUB_SERVER_URL+'/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+context.runId,description:'Browser QA in progress'});
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local Motion library for browser tests
        run: bash .github/scripts/marketing-motion-vendor.sh marketing
      - name: Build Peak Chart frontend bundle
        run: bash .github/scripts/marketing-peak-chart-build.sh marketing
      - name: Build Provably hero frontend bundle
        run: bash .github/scripts/marketing-provably-build.sh marketing
      - name: Capture and check 48 page and viewport combinations
        run: python .github/scripts/marketing-visual-qa.py
      - name: Publish screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-visual-review
          path: test-results/marketing-visual/
          if-no-files-found: warn
          retention-days: 7
      - name: Report QA outcome
        if: always()
        uses: actions/github-script@v7
        env:
          QA_RESULT: ${{ job.status }}
        with:
          script: |
            const state=process.env.QA_RESULT==='success'?'success':process.env.QA_RESULT==='cancelled'?'error':'failure';
            await github.rest.repos.createCommitStatus({...context.repo,sha:context.sha,state,context:'marketing-visual-qa',target_url:process.env.GITHUB_SERVER_URL+'/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+context.runId,description:'Browser QA '+process.env.QA_RESULT});
