name: Marketing visual QA
on:
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - '.github/scripts/marketing-visual-qa.py'
      - '.github/scripts/marketing-motion-vendor.sh'
      - '.github/scripts/marketing-peak-chart-build.sh'
      - '.github/workflows/marketing-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marketing-visual-qa
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local Motion library for browser tests
        run: bash .github/scripts/marketing-motion-vendor.sh marketing
      - name: Build Peak Chart frontend bundle
        run: bash .github/scripts/marketing-peak-chart-build.sh marketing
      - name: Capture and check 36 page and viewport combinations
        run: python .github/scripts/marketing-visual-qa.py
      - name: Publish screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-visual-review
          path: test-results/marketing-visual/
          if-no-files-found: warn
          retention-days: 7
