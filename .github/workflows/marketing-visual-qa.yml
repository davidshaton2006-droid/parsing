name: Marketing visual QA
on:
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - '.github/scripts/marketing-visual-qa.py'
      - '.github/scripts/marketing-render-3d.py'
      - '.github/workflows/marketing-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marketing-visual-qa
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Render local 3D preview assets for browser QA
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m pip install numpy pillow
          python .github/scripts/marketing-render-3d.py marketing/assets/reference --width 360
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('marketing/assets/reference/manifest.json')
          data=json.loads(p.read_text())
          for key in ('architecture','journey','partnership','portfolio','ai-core','automation-flow','commerce','mobile-app','integration-hub','knowledge-vault'):
              assert (p.parent/(key+'.webp')).is_file()
              data[key]='/parsing/marketing/assets/reference/'+key+'.webp'
          p.write_text(json.dumps(data,indent=2))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local Motion library for browser tests
        run: bash .github/scripts/marketing-motion-vendor.sh marketing
      - name: Capture and check 36 page and viewport combinations
        run: python .github/scripts/marketing-visual-qa.py
      - name: Publish screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-visual-review
          path: test-results/marketing-visual/
          if-no-files-found: warn
          retention-days: 7
