name: Deploy client previews to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'st-car/**'
      - 'index.html'
      - 'apps/chizh-avto/**'
      - 'apps/doctor-car/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout all client sites
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-chizh-${{ hashFiles('apps/chizh-avto/package.json') }}

      - name: Validate ST CAR static site
        run: node st-car/scripts/check-static.mjs

      - name: Install Chizh-Avto app dependencies
        working-directory: apps/chizh-avto
        run: npm install --no-audit --no-fund

      - name: Check app structure and factual sourcing
        working-directory: apps/chizh-avto
        run: |
          npm run check:static
          node scripts/factual-audit.mjs

      - name: Synchronize public facts from original website
        working-directory: apps/chizh-avto
        timeout-minutes: 4
        continue-on-error: true
        env:
          CHIZH_MAX_PAGES: ${{ github.event_name == 'pull_request' && '28' || '150' }}
        run: npm run sync:official

      - name: Restore processed company photos
        uses: actions/cache@v4
        with:
          path: apps/chizh-avto/public/media
          key: ${{ runner.os }}-chizh-photo-cache-v2-${{ hashFiles('apps/chizh-avto/src/data/catalog.js', 'apps/chizh-avto/scripts/optimize-media.mjs') }}

      - name: Generate responsive WebP images from Chizh-Avto's real photos
        working-directory: apps/chizh-avto
        timeout-minutes: 7
        run: npm run optimize:media

      - name: Build React app with correct Pages base URL
        working-directory: apps/chizh-avto
        run: |
          node scripts/factual-audit.mjs
          npm run build
          npm run check:budget
          test -s dist/index.html
          test -d dist/assets

      - name: Install Playwright Chromium
        working-directory: apps/chizh-avto
        run: npx playwright install --with-deps chromium

      - name: Check interactive pages in desktop and mobile browsers
        working-directory: apps/chizh-avto
        run: npm run test:e2e

      - name: Upload browser screenshots for design QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chizh-design-review
          path: apps/chizh-avto/test-results/
          if-no-files-found: ignore
          retention-days: 3

      - name: Restore npm cache for Doctor Car
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-doctor-${{ hashFiles('apps/doctor-car/package.json') }}

      - name: Install Doctor Car React dependencies
        working-directory: apps/doctor-car
        run: npm install --no-audit --no-fund

      - name: Build the approved dark/light Doctor Car site
        working-directory: apps/doctor-car
        run: |
          npm run build
          test -s dist/index.html
          test -s dist/visual/tech-car.svg
          test -d dist/assets

      - name: Test Doctor Car interactions on desktop and mobile
        working-directory: apps/doctor-car
        run: npm run test

      - name: Upload Doctor Car browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-car-design-review
          path: apps/doctor-car/test-results/
          if-no-files-found: ignore
          retention-days: 4

      - name: Assemble Pages artifact without app sources or secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pages"
          rsync -a ./ "$RUNNER_TEMP/pages/" \
            --exclude='/.git/' --exclude='/.github/' --exclude='/apps/' \
            --exclude='/skills/' --exclude='/st-car/scripts/' --exclude='*.md' --exclude='*.zip' \
            --exclude='node_modules/' --exclude='*.env' --exclude='*.map' \
            --exclude='playwright-report/' --exclude='test-results/'
          rm -rf "$RUNNER_TEMP/pages/chizh-avto"
          mkdir -p "$RUNNER_TEMP/pages/chizh-avto"
          cp -a apps/chizh-avto/dist/. "$RUNNER_TEMP/pages/chizh-avto/"
          mkdir -p "$RUNNER_TEMP/pages/doctor-car"
          cp -a apps/doctor-car/dist/. "$RUNNER_TEMP/pages/doctor-car/"
          test -s "$RUNNER_TEMP/pages/doctor-car/index.html"
          test -s "$RUNNER_TEMP/pages/chizh-avto/index.html"
          test -s "$RUNNER_TEMP/pages/index.html"
          test -f "$RUNNER_TEMP/pages/.nojekyll"

      - name: Package Motion JavaScript library
        run: bash .github/scripts/marketing-motion-vendor.sh "$RUNNER_TEMP/pages/marketing"

      - name: Build Peak Chart frontend bundle
        run: bash .github/scripts/marketing-peak-chart-build.sh "$RUNNER_TEMP/pages/marketing"

      - name: Restore original marketing 3D artwork
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/marketing-render-cache
          key: marketing-3d-studio-v2-${{ hashFiles('.github/scripts/marketing-render-3d.py') }}

      - name: Generate and package original marketing 3D scenes
        continue-on-error: true
        timeout-minutes: 16
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -e
          cache="$RUNNER_TEMP/marketing-render-cache"
          mkdir -p "$cache"
          python3 -m venv "$RUNNER_TEMP/marketing-render-env"
          "$RUNNER_TEMP/marketing-render-env/bin/pip" -q install numpy pillow
          for scene in architecture journey partnership portfolio ai-core automation-flow commerce mobile-app integration-hub knowledge-vault; do
            if [ ! -s "$cache/$scene.webp" ]; then
              width=560
              case "$scene" in architecture|journey|partnership|portfolio) width=960 ;; esac
              "$RUNNER_TEMP/marketing-render-env/bin/python" .github/scripts/marketing-render-3d.py "$cache" --width "$width" --scene "$scene" || echo "Fallback retained for $scene"
            fi
          done
          python3 - "$cache" "$RUNNER_TEMP/pages/marketing/assets/reference" <<'PY'
          from pathlib import Path
          import json, shutil, sys
          source, dest = map(Path, sys.argv[1:])
          manifest = dest / 'manifest.json'
          data = json.loads(manifest.read_text())
          for key in ('architecture','journey','partnership','portfolio','ai-core','automation-flow','commerce','mobile-app','integration-hub','knowledge-vault'):
              art = source / (key + '.webp')
              if art.is_file() and art.stat().st_size > 1000:
                  shutil.copyfile(art, dest / art.name)
                  data[key] = '/parsing/marketing/assets/reference/' + art.name
          manifest.write_text(json.dumps(data, indent=2))
          PY

      - name: Capture actual desktop and mobile portfolio previews
        continue-on-error: true
        timeout-minutes: 6
        run: node .github/scripts/marketing-project-previews.mjs "$RUNNER_TEMP/pages"

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
