name: AVM Motors dedicated QA
on:
  push:
    branches: [main]
    paths:
      - 'avm-motors-red/**'
      - 'avm-motors-heritage/**'
      - 'avm-motors-assets/**'
      - '.github/workflows/avm-qa.yml'
  pull_request:
    paths:
      - 'avm-motors-red/**'
      - 'avm-motors-heritage/**'
      - 'avm-motors-assets/**'
      - '.github/workflows/avm-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout demo portfolio
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA tooling
        working-directory: avm-motors-assets
        run: npm install --no-audit --no-fund
      - name: Validate script syntax
        working-directory: avm-motors-assets
        run: npm run check:syntax
      - name: Install browser
        working-directory: avm-motors-assets
        run: npx playwright install --with-deps chromium
      - name: Run 2-site desktop and mobile E2E
        working-directory: avm-motors-assets
        run: npm run test:e2e
      - name: Preserve failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avm-qa-report
          path: |
            avm-motors-assets/playwright-report
            avm-motors-assets/test-results
          if-no-files-found: ignore
          retention-days: 7
