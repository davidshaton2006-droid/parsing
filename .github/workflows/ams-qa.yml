name: AutoMediaStudio browser QA
on:
  push:
    branches: [main]
    paths:
      - 'ams-studio/**'
      - '.github/qa/ams/**'
      - '.github/workflows/ams-qa.yml'
  pull_request:
    paths:
      - 'ams-studio/**'
      - '.github/qa/ams/**'
      - '.github/workflows/ams-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript
        run: node --check ams-studio/app.js
      - name: Install browser QA
        working-directory: .github/qa/ams
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Test desktop, mobile, form and navigation
        working-directory: .github/qa/ams
        run: npm run test:e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ams-site-visual-qa
          path: .github/qa/ams/test-results/
          if-no-files-found: ignore
          retention-days: 4
