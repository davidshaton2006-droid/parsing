let project=fresh(),selected=project.blocks[0].id,history=[],future=[],timer,dirty=false;try{let raw=localStorage.getItem("shaton-proposal-v1");if(raw)project=normalize(JSON.parse(raw));selected=project.blocks[0]?.id;}catch(e){}

const css=String.raw`

rder:1px solid var(--line);border-radius:var(--radius);text-align:left}.card small{font:12px ui-monospace,monospace;color:var(--accent)}.card h3{margin:12px 0 8px;font-size:20px;line-height:1.2;letter-spacing:-.02em}.card p{color:var(--muted);margin:0;white-space:pre-wrap}.price{font-size:24px;font-weight:650;margin-top:20px}.art{height:clamp(180px,32vw,380px);display:grid;place-items:center;perspective:800px;overflow:hidden}.cube{position:relative;width:110px;height:110px;transform-style:preserve-3d;animation:spin 17s linear infinite}.cube i{position:absolute;inset:0;background:linear-gradient(135deg,#24242a,#030303 80%);border:1px solid #45454f}.cube i:nth-child(1){transform:translateZ(55px)}.cube i:nth-child(2){transform:rotateY(90deg) translateZ(55px)}.cube i:nth-child(3){transform:rotateY(180deg) translateZ(55px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(55px)}.cube i:nth-child(5){transform:rotateX(90deg) translateZ(55px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(55px)}@keyframes spin{from{transform:rotateX(-22deg) rotateY(0)}to{transform:rotateX(-22deg) rotateY(360deg)}}.resend h1{font-family:Georgia,serif;font-weight:400;letter-spacing:-.025em}.doppler .art{background:radial-gradient(ellipse,#6b13f54d,transparent 70%)}.console{border:1px solid var(--line);background:var(--surface);padding:18px;border-radius:20px;width:90%;font:12px ui-monospace,monospace;transform:rotate(-3deg);box-shadow:0 0 50px #b997ff16}.console p{margin:10px 0;border-bottom:1px solid var(--line);padding-bottom:10px}.console b{color:#00f575}.uizard .hero:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 70%,#6419ff45,transparent 68%)}.uizard .hero .composition.stack .copy{text-align:center}.uizard .hero .composition.stack .copy p{margin-left:auto;margin-right:auto}.uizard .hero .art{height:150px}.uizard .cta{box-shadow:0 2px 12px #a881fe60}.orb{width:100px;height:100px;border:1px solid #bca1ff;border-radius:50%;background:radial-gradient(circle at 28% 22%,#e5d6ff,#8d57ff 34%,#251047 65%,#0b0b0b);box-shadow:0 0 70px #a881fe60;animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-14px)}}.reveal{transition:opacity var(--duration) ease,transform var(--duration) ease;transition-delay:var(--delay)}.motion .reveal:not(.shown){opacity:0;transform:translateY(16px)}.motion .reveal[data-animation=slide]:not(.shown){transform:translateX(-24px)}.motion .reveal[data-animation=scale]:not(.shown){transform:scale(.96)}footer{padding:30px 6%;border-top:1px solid var(--line);color:var(--muted);font-size:12px}@media(max-width:650px){header.site{padding:18px 5%;align-items:flex-start}header.site span{font-size:10px}.composition,.split,.reverse{grid-template-columns:1fr!important;gap:22px}.reverse .visual{grid-column:auto;grid-row:auto}.cards{grid-template-columns:1fr!important}.copy h1{font-size:clamp(36px,10vw,56px)}section{padding:min(var(--pad),52px) 0}.art{height:200px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.reveal{opacity:1!important;transform:none!important}}@media print{body{print-color-adjust:exact;-webkit-print-color-adjust:exact}.reveal{opacity:1!important;transform:none!important}.art *{animation:none!important}.card{break-inside:avoid}section{padding:26px 0}header.site{padding:12px 0}main{padding:0 3%}.cta{box-shadow:none!important}}

function art(theme){return theme==="resend"?'<div class="art" aria-hidden="true"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>':theme==="doppler"?'<div class="art" aria-hidden="true"><div class="console"><p>SHATON / SOLUTIONS</p><p>01 · Анализ задач <b>●</b></p><p>02 · Проектирование <b>●</b></p><p>03 · Разработка <b>●</b></p><p>04 · Запуск <b>●</b></p></div></div>':'<div class="art" aria-hidden="true"><div class="orb"></div></div>';}
function section(b){const isHero=b.type==="hero",image=safeImage(b.image),visual=image?'<img src="'+image+'" alt="'+esc(b.alt)+'">':isHero?art(project.theme):"";let layout=visual?(b.layout==="auto"?(project.theme==="uizard"?"stack":"split"):b.layout):"stack";let link=href(b.url),cta=b.button&&link?'<a class="cta" href="'+link+'"'+(link.startsWith("#")?"":' target="_blank" rel="noopener noreferrer"')+'>'+interp(b.button)+'</a>':"";let cards=(b.items||[]).map((i,n)=>'<article class="card"><small>'+String(n+1).padStart(2,"0")+'</small><h3>'+interp(i.title)+'</h3><p>'+interp(i.body)+'</p>'+(i.price?'<div class="price">'+interp(i.price)+'</div>':'')+'</article>').join("");let st="--pad:"+b.padding+"px;--image-width:"+b.imageWidth+"%;--fit:"+b.imageFit+";--pos:"+b.imageX+"% "+b.imageY+"%;--columns:"+Math.round(b.columns)+";--duration:"+b.duration+"ms;--delay:"+b.delay+"ms";return '<section '+(b.type==="cta"?'id="contact" ':'')+'class="'+b.type+' '+(b.animation==="none"?"":"reveal")+'" data-block="'+b.id+'" data-animation="'+b.animation+'" style="'+st+'"><div class="composition '+layout+'"><div class="copy align-'+b.align+'"><div class="eyebrow">'+interp(b.eyebrow)+'</div><'+(isHero?"h1":"h2")+'>'+interp(b.title)+'</'+(isHero?"h1":"h2")+'><p>'+interp(b.body)+'</p>'+cta+'</div>'+(visual?'<div class="visual">'+visual+'</div>':'')+'</div>'+(cards?'<div class="cards">'+cards+'</div>':'')+'</section>';}
function documentHTML(edit=false){const t=themes[project.theme],vars=Object.entries(t).map(([k,v])=>"--"+k.replace(/[A-Z]/g,m=>"-"+m.toLowerCase())+":"+(typeof v==="number"?v+"px":v)).join(";");const runtime="(function(){if('IntersectionObserver' in window&&!matchMedia('(prefers-reduced-motion: reduce)').matches){document.documentElement.classList.add('motion');const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('shown');o.unobserve(e.target)}}),{threshold:.08});document.querySelectorAll('.reveal').forEach(e=>o.observe(e));}"+(edit?"document.addEventListener('click',e=>{const s=e.target.closest('[data-block]');if(s){e.preventDefault();parent.postMessage({type:'select',id:s.dataset.block},'*')}});":"")+"})();";return '<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(project.brand)+" — Коммерческое предложение"+'</title><style>:root{'+vars+'}'+css+'</style></head><body class="'+project.theme+'"><header class="site"><strong>'+esc(project.brand)+'</strong><span>КОММЕРЧЕСКОЕ ПРЕДЛОЖЕНИЕ</span></header><main>'+project.blocks.filter(b=>!b.hidden).map(section).join("")+'</main><footer>'+esc(project.brand)+'</footer><script>'+runtime+'<\/script></body></html>';}
function refresh(){let f=$("preview");f.srcdoc=documentHTML(true);buttons();}
function renderLayers(){let root=$("layers");root.replaceChildren();project.blocks.forEach((b,i)=>{const el=document.createElement("div");el.className="layer"+(b.id===selected?" active":"");el.draggable=true;el.tabIndex=0;el.title=b.title;const grip=document.createElement("span");grip.className="grip";grip.textContent="⠿";const name=document.createElement("span");name.textContent=(b.hidden?"◌ ":"")+names[b.type];el.append(grip,name);for(const [delta,label] of [[-1,"↑"],[1,"↓"]]){let a=document.createElement("button");a.textContent=label;a.disabled=i+delta<0||i+delta>=project.blocks.length;a.setAttribute("aria-label",delta<0?"Выше":"Ниже");a.onclick=e=>{e.stopPropagation();change(()=>{let x=project.blocks.splice(i,1)[0];project.blocks.splice(i+delta,0,x);});};el.append(a);}el.onclick=()=>selectBlock(b.id);el.onkeydown=e=>{if(e.target===el&&(e.key==="Enter"||e.key===" ")){e.preventDefault();selectBlock(b.id);}};el.ondragstart=e=>e.dataTransfer.setData("text/plain",b.id);el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const id=e.dataTransfer.getData("text/plain"),j=project.blocks.findIndex(x=>x.id===id);if(j>=0&&j!==i)change(()=>{let x=project.blocks.splice(j,1)[0];project.blocks.splice(i,0,x);});};root.append(el);});}
function field(parent,label,value,onchange,opts={}){let l=document.createElement("label");l.textContent=label;let el=document.createElement(opts.options?"select":opts.multi?"textarea":"input");el.id=uid();l.htmlFor=el.id;if(opts.options){for(const [v,t] of opts.options){let o=document.createElement("option");o.value=v;o.textContent=t;el.append(o);}}else if(!opts.multi){el.type=opts.type||"text";if(opts.min!==undefined)el.min=opts.min;if(opts.max!==undefined)el.max=opts.max;if(opts.step!==undefined)el.step=opts.step;}el.value=value??"";el.onchange=()=>onchange(el.type==="number"?Number(el.value):el.value);parent.append(l,el);return el;}
function action(parent,text,fn,cls=""){let b=document.createElement("button");b.textContent=text;b.className=cls;b.onclick=fn;parent.append(b);return b;}
function heading(parent,text){let l=document.createElement("div");l.className="label";l.textContent=text;parent.append(l);}
function renderInspector(){let root=$("inspector");root.replaceChildren();const b=project.blocks.find(x=>x.id===selected);if(!b){heading(root,"Выберите блок");return;}heading(root,names[b.type]);let set=(k,v)=>change(()=>b[k]=v,false);for(const [k,l] of [["eyebrow","Надзаголовок"],["title","Заголовок"],["body","Описание"]])field(root,l,b[k],v=>set(k,v),{multi:k==="body"});if(b.type==="hero"||b.type==="cta"){field(root,"Текст кнопки",b.button,v=>set("button",v));field(root,"Ссылка (https:, mailto:, tel:)",b.url,v=>set("url",v));}heading(root,"Изображение");let file=document.createElement("input");file.type="file";file.accept="image/png,image/jpeg,image/webp,image/gif,image/avif";file.onchange=()=>{const f=file.files[0];if(!f)return;if(f.size>3*1024*1024){status("Изображение больше 3 МБ");return;}let reader=new FileReader();reader.onload=()=>{if(!safeImage(reader.result)){status("Формат изображения не поддерживается");return;}if(project.blocks.includes(b))change(()=>b.image=reader.result);};reader.readAsDataURL(f);};root.append(file);if(b.image)action(root,"Удалить изображение",()=>change(()=>b.image=""));field(root,"Описание изображения",b.alt,v=>set("alt",v));heading(root,"Композиция");field(root,"Расположение",b.layout,v=>set("layout",v),{options:[["auto","По умолчанию темы"],["stack","Вертикально"],["split","Текст / объект"],["reverse","Объект / текст"]]});field(root,"Выравнивание",b.align,v=>set("align",v),{options:[["left","Слева"],["center","По центру"],["right","Справа"]]});for(const [k,l,a,z] of [["padding","Вертикальный отступ, px",16,144],["imageWidth","Ширина объекта, %",25,70],["imageX","Положение фото X, %",0,100],["imageY","Положение фото Y, %",0,100]])field(root,l,b[k],v=>set(k,clamp(v,a,z,50)),{type:"number",min:a,max:z});field(root,"Режим изображения",b.imageFit,v=>set("imageFit",v),{options:[["cover","Заполнить"],["contain","Вписать"]]});if(b.items){heading(root,"Карточки");field(root,"Колонки",b.columns,v=>set("columns",Math.round(clamp(v,1,4,3))),{type:"number",min:1,max:4});b.items.forEach((item,i)=>{let g=document.createElement("div");g.className="fieldgroup";heading(g,"Карточка "+(i+1));for(const [k,l] of [["title","Название"],["body","Описание"],["price","Цена / подпись"]])field(g,l,item[k],v=>change(()=>item[k]=v,false),{multi:k==="body"});let r=document.createElement("div");r.className="row";action(r,"↑",()=>{if(i>0)change(()=>{[b.items[i-1],b.items[i]]=[b.items[i],b.items[i-1]];});}).disabled=i===0;action(r,"↓",()=>{if(i<b.items.length-1)change(()=>{[b.items[i+1],b.items[i]]=[b.items[i],b.items[i+1]];});}).disabled=i===b.items.length-1;action(r,"Удалить",()=>change(()=>b.items.splice(i,1)),"danger");g.append(r);root.append(g);});action(root,"+ Карточка",()=>change(()=>b.items.push({title:"Новая карточка",body:"",price:""}))).disabled=b.items.length>=40;}heading(root,"Анимация");field(root,"Эффект",b.animation,v=>set("animation",v),{options:[["none","Нет"],["fade","Плавное появление"],["slide","Сдвиг"],["scale","Масштаб"]]});for(const [k,l,a,z] of [["duration","Длительность, мс",100,2000],["delay","Задержка, мс",0,1000]])field(root,l,b[k],v=>set(k,clamp(v,a,z,a)),{type:"number",min:a,max:z});heading(root,"Управление блоком");action(root,b.hidden?"Показать":"Скрыть",()=>change(()=>b.hidden=!b.hidden));action(root,"Дублировать",()=>change(()=>{const x=clone(b);x.id=uid();project.blocks.splice(project.blocks.indexOf(b)+1,0,x);selected=x.id;})).disabled=project.blocks.length>=100;action(root,"Удалить",()=>{if(confirm("Удалить блок?"))change(()=>{project.blocks=project.blocks.filter(x=>x!==b);selected=project.blocks[0]?.id;});},"danger");}
function selectBlock(id){if(project.blocks.some(b=>b.id===id)){selected=id;renderLayers();renderInspector();}}
function render(){for(const k of ["theme","recipient","company","brand"])$(k).value=project[k];renderLayers();renderInspector();refresh();}
for(const k of ["theme","recipient","company","brand"])$(k).onchange=()=>change(()=>project[k]=$(k).value,false);
$("add").onclick=()=>{if(project.blocks.length>=100)return;change(()=>{let b=block($("addtype").value);project.blocks.push(b);selected=b.id;});};
$("new").onclick=()=>{if(confirm("Создать новое КП? Сохрани текущий JSON, если он нужен."))change(()=>{project=fresh();selected=project.blocks[0].id;});};
$("undo").onclick=()=>{if(history.length){future.push(clone(project));project=history.pop();if(!project.blocks.some(b=>b.id===selected))selected=project.blocks[0]?.id;render();autosave();}};
$("redo").onclick=()=>{if(future.length){history.push(clone(project));project=future.pop();if(!project.blocks.some(b=>b.id===selected))selected=project.blocks[0]?.id;render();autosave();}};
function download(content,name,type){let a=document.createElement("a"),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function filename(){return (project.company||"Shaton").replace(/[^\p{L}\p{N}_-]+/gu,"_").slice(0,70);}
$("save").onclick=()=>download(JSON.stringify(project,null,2),filename()+".json","application/json");
$("export").onclick=()=>download(documentHTML(),filename()+"_offer.html","text/html;charset=utf-8");
$("open").onclick=()=>$("import").click();
$("import").onchange=async()=>{const f=$("import").files[0];if(!f)return;try{if(f.size>30*1024*1024)throw Error("Файл слишком большой");const p=normalize(JSON.parse(await f.text()));change(()=>{project=p;selected=project.blocks[0]?.id;});status("Проект загружен");}catch(e){status("Ошибка импорта: "+e.message);}finally{$("import").value="";}};
$("desktop").onclick=()=>$("preview").classList.remove("mobile");$("mobile").onclick=()=>$("preview").classList.add("mobile");$("play").onclick=refresh;
$("print").onclick=()=>{const w=window.open("","_blank");if(!w){status("Разрешите всплывающие окна");return;}w.document.open();w.document.write(documentHTML());w.document.close();let printed=false;const run=()=>{if(!printed&&!w.closed){printed=true;w.focus();w.print();}};w.addEventListener("load",run,{once:true});setTimeout(run,800);};
window.addEventListener("message",e=>{if(e.source===$("preview").contentWindow&&e.data?.type==="select")selectBlock(e.data.id);});
render();status("Готово · версия 0.1");
</script></body></html>
